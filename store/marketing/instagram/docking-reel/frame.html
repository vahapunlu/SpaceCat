<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPACE CAT Docking Reel Frame</title>
<style>
  :root{--green:#00e68a;--amber:#ffb86c;--red:#ff5c57;--grey:#8f9ba7;--bg:#020407}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  html.capture body{width:648px;height:1152px}
  html.capture .reel{transform:scale(.6);transform-origin:0 0}
  body{font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;color:var(--green)}
  .reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:
    radial-gradient(1100px 1200px at 50% 35%,#0b1820 0%,#04080d 48%,#000 100%)}
  .reel::before{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;opacity:.34;
    background:repeating-linear-gradient(to bottom,transparent 0 5px,rgba(0,0,0,.36) 5px 7px)}
  .reel::after{content:"";position:absolute;inset:0;z-index:11;pointer-events:none;
    box-shadow:inset 0 0 150px rgba(0,0,0,.9),inset 0 0 24px rgba(0,230,138,.12)}
  .top{position:absolute;top:132px;left:75px;right:75px;display:flex;justify-content:space-between;
    color:var(--grey);font-size:25px;letter-spacing:.12em;text-shadow:none}
  .live{color:var(--green)}
  .hero{position:absolute;top:225px;left:70px;right:70px;text-align:center}
  .kicker{font-size:25px;letter-spacing:.18em;color:var(--amber);text-shadow:0 0 12px rgba(255,184,108,.48)}
  h1{margin:24px auto 12px;font-size:68px;line-height:1.04;letter-spacing:.035em;font-weight:700;
    color:var(--green);text-shadow:0 0 17px rgba(0,230,138,.55)}
  .sub{font-size:28px;color:var(--grey);letter-spacing:.035em;text-shadow:none}
  .shell{position:absolute;top:500px;left:65px;width:950px;height:980px;padding:27px 29px;
    border:2px solid rgba(0,230,138,.42);background:rgba(1,5,8,.92);box-shadow:
    0 0 55px rgba(0,230,138,.12) inset,0 0 36px rgba(0,230,138,.09)}
  .shell.amber{border-color:rgba(255,184,108,.6);box-shadow:0 0 60px rgba(255,184,108,.12) inset}
  .shell.red{border-color:rgba(255,92,87,.65);box-shadow:0 0 60px rgba(255,92,87,.12) inset}
  .screen{margin:0;white-space:pre;color:var(--green);font-size:19px;line-height:1.19;letter-spacing:0;
    text-shadow:0 0 9px rgba(0,230,138,.55)}
  .flightdeck{position:absolute;left:29px;right:29px;bottom:28px;height:252px;padding:22px 24px;
    border-top:1px solid rgba(0,230,138,.46);background:linear-gradient(180deg,rgba(0,230,138,.025),rgba(0,230,138,.075));
    color:var(--green);text-shadow:0 0 8px rgba(0,230,138,.38)}
  .deck-title{display:flex;justify-content:space-between;margin-bottom:19px;color:var(--grey);font-size:17px;letter-spacing:.14em}
  .deck-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-bottom:22px}
  .deck-cell{padding-right:14px;border-right:1px solid rgba(0,230,138,.19)}
  .deck-cell:last-child{border-right:0}.deck-label{font-size:14px;color:var(--grey);letter-spacing:.14em}
  .deck-value{margin-top:8px;font-size:25px;letter-spacing:.035em}
  .phase-line{display:flex;align-items:center;gap:13px;font-size:15px;color:var(--grey);letter-spacing:.08em}
  .phase-line span{color:rgba(143,155,167,.55)}.phase-line .done{color:var(--green)}.phase-line .active{color:var(--amber)}
  .pulse{width:9px;height:9px;background:var(--green);box-shadow:0 0 12px rgba(0,230,138,.9)}
  .amber .flightdeck{border-color:rgba(255,184,108,.5);background:linear-gradient(180deg,rgba(255,184,108,.02),rgba(255,184,108,.08));color:var(--amber)}
  .amber .screen{color:var(--amber);text-shadow:0 0 10px rgba(255,184,108,.48)}
  .red .screen{color:var(--red);text-shadow:0 0 10px rgba(255,92,87,.48)}
  .telemetry{position:absolute;left:65px;right:65px;top:1515px;padding:18px 22px;border-left:4px solid var(--amber);
    background:rgba(255,184,108,.05);font-size:23px;line-height:1.45;color:var(--amber);text-shadow:none}
  .telemetry b{color:var(--grey);font-weight:400}
  .footer{position:absolute;left:75px;right:75px;bottom:158px;text-align:center}
  .cta{font-size:31px;letter-spacing:.1em;color:var(--green);text-shadow:0 0 11px rgba(0,230,138,.5)}
  .url{margin-top:18px;font-size:39px;color:var(--amber);letter-spacing:.035em;text-shadow:0 0 12px rgba(255,184,108,.45)}
  .cursor{display:inline-block;width:18px;height:34px;margin-left:8px;vertical-align:-5px;background:var(--green)}
  .boot .shell{top:500px;height:985px}
  .boot .screen{font-size:21px;line-height:1.2}
  .boot .flightdeck{height:205px}
  .cta-scene .shell{top:430px;height:900px}
  .cta-scene .telemetry{top:1390px}
  .cta-scene .footer{bottom:270px}
  .cta-scene h1{font-size:76px}
</style>
</head>

const params=new URLSearchParams(location.search);
if(params.get('capture')==='1')document.documentElement.classList.add('capture');
const key=params.get('scene')||'boot';
